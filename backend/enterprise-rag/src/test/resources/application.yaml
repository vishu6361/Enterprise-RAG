server:
  servlet:
    context-path: /enterprise-rag
  port: 8800

spring:
  application:
    name: enterprise-rag-test
  profiles:
    active: test

  datasource:
    read:
      url: jdbc:h2:mem:enterprise_rag_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      hikari:
        maximum-pool-size: 5
    write:
      url: jdbc:h2:mem:enterprise_rag_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      hikari:
        maximum-pool-size: 5

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        query:
          plan_cache_max_size: 64
          plan_parameter_metadata_max_size: 32
          in_clause_parameter_padding: true
    show-sql: false
    open-in-view: false

  session:
    store-type: none

app:
  storage:
    upload-dir: target/test-uploads
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
