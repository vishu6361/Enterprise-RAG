#******* Application Configuration *********
server:
  servlet:
    context-path: /enterprise-rag
  port: 8800

spring:
  application:
    name: enterprise-rag
  profiles:
    active: dev
  # ***** Jpa Configuration *****
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        query:
          plan_cache_max_size: 64
          plan_parameter_metadata_max_size: 32
          in_clause_parameter_padding: true
  session:
    store-type: none

